packages:
  - "apps/*"
  - "packages/*"
  # Template starters live in the install graph ONLY so their `workspace:*` deps
  # (@nseluga/ui, @nseluga/config, @nseluga/app-core) resolve locally. When a template is
  # extracted to its own repo those become versioned `@nseluga/*` registry deps.
  - "templates/*"
