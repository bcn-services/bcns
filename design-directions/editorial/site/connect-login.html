<!doctype html>
<!-- PROTOTYPE bcns Connect hub (direction L, linked draft) — throwaway -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bcns Connect | Sign in</title>
<meta name="description" content="Sign in to your bcns Connect workspace.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("bcns-site-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="assets/site.css">
<style>
  /* hub-only styles; tokens + base come from assets/site.css */
  body { font-size: 16px; line-height: 1.55; }
  .caps { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .16em; }
  .wm { display: inline-flex; align-items: center; gap: 10px; }
  .wm svg { width: 30px; height: 31px; flex: none; }
  .wm span { white-space: nowrap; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -.02em; line-height: 1; }
  .wm span b { font-weight: 600; color: var(--primary); }

  .b { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; height: 40px; padding: 0 20px; font: 600 15px "Manrope", sans-serif; background: var(--primary-ink); color: var(--on-primary); border: 1px solid transparent; cursor: pointer; transition: transform .25s ease-out, box-shadow .25s ease-out, background-color .2s, border-color .2s; }
  :root[data-theme="dark"] .b { background: var(--primary); }
  .b:hover { transform: translateY(-1px); box-shadow: 0 8px 20px var(--shadow); }
  .b.out, :root[data-theme="dark"] .b.out { background: transparent; color: var(--ink); border-color: var(--input); font-weight: 500; }
  .b.out:hover { border-color: var(--primary); background: var(--tint); box-shadow: none; transform: none; }
  .b.ghost, :root[data-theme="dark"] .b.ghost { background: transparent; color: var(--muted); border-color: transparent; font-weight: 500; }
  .b.ghost:hover { color: var(--ink); background: var(--tint); box-shadow: none; transform: none; }
  .b.sm { height: 36px; padding: 0 14px; font-size: 14px; }
  .b[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .lnk { font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--input); }
  .lnk:hover { color: var(--primary-ink); text-decoration-color: currentColor; }
  .ul { color: var(--primary-ink); font-weight: 500; text-decoration: underline; text-underline-offset: 4px; }
  :root[data-theme="dark"] .ul { color: var(--primary); }
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; min-width: 0; }
  label.f input { height: 42px; border-radius: 8px; border: 1px solid var(--input); background: var(--bg); color: var(--ink); padding: 0 12px; font: 400 15px "Manrope", sans-serif; width: 100%; min-width: 0; }
  label.f input:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--shadow); }
  :root[data-theme="dark"] input[type="date"] { color-scheme: dark; }

  /* hub header */
  .hh { position: sticky; top: 0; z-index: 30; background: var(--card); border-bottom: 1px solid var(--border); }
  .hh-in { max-width: 1200px; margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; gap: 10px; }
  .hh .wm { margin-right: auto; }
  .burger { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--input); background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .burger:hover { background: var(--tint); }
  .burger svg { width: 20px; height: 20px; }
  .hh.open .burger .b3 { display: none; }
  .hh.open .burger .x { display: block; }
  .hh-menu { display: none; position: absolute; top: 64px; left: 0; right: 0; background: var(--card); border-bottom: 1px solid var(--border); padding: 4px 16px 20px; flex-direction: column; box-shadow: 0 20px 40px var(--shadow); }
  .hh.open .hh-menu { display: flex; }
  .hh-menu nav { display: flex; flex-direction: column; }
  .hh-menu nav a { padding: 14px 4px; font-size: 17px; font-weight: 500; color: var(--ink); border-bottom: 1px solid var(--border); }
  .hh-menu nav a[aria-current] { color: var(--primary-ink); box-shadow: inset 3px 0 0 var(--primary); padding-left: 14px; }
  :root[data-theme="dark"] .hh-menu nav a[aria-current] { color: var(--primary); }
  .who { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; min-width: 0; font-size: 14px; color: var(--muted); }
  .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  @media (min-width: 900px) {
    .hh-in { padding: 0 32px; gap: 12px; }
    .hh .wm { margin-right: 28px; }
    .burger { display: none; }
    .hh-menu { display: contents; }
    .hh-menu nav { flex-direction: row; gap: 24px; align-self: stretch; margin-right: auto; }
    .hh-menu nav a { display: flex; align-items: center; padding: 0; font-size: 15px; color: var(--muted); border-bottom: 2px solid transparent; border-top: 2px solid transparent; transition: color .2s; }
    .hh-menu nav a:hover { color: var(--ink); }
    .hh-menu nav a[aria-current] { color: var(--ink); border-bottom-color: var(--primary); box-shadow: none; padding-left: 0; }
    :root[data-theme="dark"] .hh-menu nav a[aria-current] { color: var(--ink); }
    .who { margin-top: 0; order: 1; }
    .theme { order: 2; }
  }

  .app { max-width: 1200px; margin: 0 auto; padding: 32px 16px 56px; display: flex; flex-direction: column; gap: 24px; }
  @media (min-width: 900px) { .app { padding: 44px 32px 72px; } }
  .app > * { min-width: 0; }
  .app h1 { font-weight: 300; font-size: clamp(2rem, 4vw, 2.75rem); letter-spacing: -.025em; line-height: 1.08; }
  .app h1 b { font-weight: 600; color: var(--primary); }
  .app .lead { margin-top: 10px; max-width: 36rem; color: var(--muted); }
  .hfoot { border-top: 1px solid var(--border); padding: 18px 16px 28px; font-size: 14px; color: var(--muted); text-align: center; }
  .hfoot a { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--input); }
  .hfoot a:hover { color: var(--primary-ink); }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .panel h2 { font: 500 18px "Space Grotesk", sans-serif; letter-spacing: -.01em; }
  .panel .sub { margin-top: 2px; font-size: 14px; color: var(--muted); }
  .note { margin: 0; padding: 12px 16px; border-radius: 10px; font-size: 14.5px; border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent); background: color-mix(in srgb, var(--primary) 9%, transparent); color: var(--primary-ink); }
  :root[data-theme="dark"] .note { color: var(--primary); }
  :root[data-theme="dark"] .note.alert, .note.alert { color: var(--err); }
  .note.alert { border-color: color-mix(in srgb, var(--err) 45%, transparent); background: var(--err-bg); color: var(--err); }
  .note.plain { border-color: var(--border); background: var(--tint); color: var(--ink); }
  .note a { font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
  .chip { display: inline-flex; align-items: center; font: 500 12px "Space Grotesk", sans-serif; text-transform: uppercase; letter-spacing: .1em; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--tint); color: var(--muted); }
  .chip.own { color: var(--primary-ink); border-color: color-mix(in srgb, var(--primary) 40%, transparent); background: color-mix(in srgb, var(--primary) 9%, transparent); }
  :root[data-theme="dark"] .chip.own { color: var(--primary); }
  .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: transparent; }
  .chip.error { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); background: transparent; }

  /* flowing dots */
  .flow { position: relative; display: block; height: 8px; overflow: hidden; }
  .flow::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--border); }
  .flow i { position: absolute; top: 50%; left: 0; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--c); opacity: 0; animation: drift 3.4s linear infinite; animation-delay: var(--dl, 0s); }
  @keyframes drift { 0% { left: 0; opacity: 0; } 14% { opacity: 1; } 86% { opacity: 1; } 100% { left: calc(100% - 5px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flow i { animation: none; left: var(--x, 50%); opacity: 1; } }

  .lg { min-height: 100vh; display: flex; flex-direction: column; background: var(--tint); }
  .lg-top { display: flex; justify-content: flex-end; padding: 14px 16px; }
  .lg-main { flex: 1; display: grid; place-items: center; padding: 16px 16px 48px; }
  .lcard { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px 28px; }
  .lcard .wm { display: flex; justify-content: center; }
  .lcard .wm svg { width: 40px; height: 41px; }
  .lcard .wm span { font-size: 26px; }
  .lcard .flow { margin: 22px 0; }
  .lcard h1 { font-weight: 300; font-size: 2rem; letter-spacing: -.025em; line-height: 1.1; }
  .lcard h1 b { font-weight: 600; color: var(--primary); }
  .lcard .d { margin-top: 8px; font-size: 15px; color: var(--muted); }
  .lcard form { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .lcard .b { height: 42px; margin-top: 4px; }
  .back { margin-top: 20px; text-align: center; font-size: 14px; }
  .back a { color: var(--muted); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--input); }
  .back a:hover { color: var(--primary-ink); }</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="mark" viewBox="44 -10.5 132 133.5"><g stroke="var(--cs)" stroke-width="2.5" stroke-linejoin="round"><g><path d="M110 -8.5 L142 10 L110 28.5 L78 10 Z" fill="#C7DDFA"/><path d="M78 10 L110 28.5 L110 65.5 L78 47 Z" fill="#7EB3F7"/><path d="M110 28.5 L142 10 L142 47 L110 65.5 Z" fill="#4A86D7"/></g><g><path d="M78 47 L110 65.5 L78 84 L46 65.5 Z" fill="#C7DDFA"/><path d="M46 65.5 L78 84 L78 121 L46 102.5 Z" fill="#7EB3F7"/><path d="M78 84 L110 65.5 L110 102.5 L78 121 Z" fill="#4A86D7"/></g><g><path d="M142 47 L174 65.5 L142 84 L110 65.5 Z" fill="#C7DDFA"/><path d="M110 65.5 L142 84 L142 121 L110 102.5 Z" fill="#7EB3F7"/><path d="M142 84 L174 65.5 L174 102.5 L142 121 Z" fill="#4A86D7"/></g></g></symbol></defs></svg>

<div class="lg">
  <div class="lg-top"><button class="theme" id="theme" type="button" aria-label="Toggle light and dark mode"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></div>
  <main class="lg-main"><div style="width:100%;max-width:400px">
    <div class="lcard">
      <a class="wm" href="../site/index.html" aria-label="Back to bcn-services.com" title="Back to bcn-services.com"><svg aria-hidden="true"><use href="#mark"/></svg><span>bcns <b>Connect</b></span></a>
      <span class="flow" aria-hidden="true"><i style="--c:#5f8f62;--dl:0s;--x:12%"></i><i style="--c:#7b6cc4;--dl:-.7s;--x:31%"></i><i style="--c:#4f978f;--dl:-1.4s;--x:50%"></i><i style="--c:#c08a3e;--dl:-2.1s;--x:69%"></i><i style="--c:#c0625a;--dl:-2.8s;--x:88%"></i></span>
      <h1>Sign <b>in</b></h1>
      <p class="d">One login for your dashboard, your sources and your team.</p>
      <form action="connect-sources.html" method="get">
        <label class="f" for="email">Email<input id="email" type="email" autocomplete="email"></label>
        <label class="f" for="password">Password<input id="password" type="password" autocomplete="current-password"></label>
        <button class="b" type="submit">Sign in</button>
        <a class="lnk" href="#" onclick="return false">Forgot password?</a>
      </form>
    </div>
    <p class="back"><a href="../site/index.html">Back to bcn-services.com</a></p>
  </div></main>
</div>
<script>(function () {
  var root = document.documentElement;
  var t = document.getElementById("theme");
  if (t) t.addEventListener("click", function () {
    var n = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", n);
    try { localStorage.setItem("bcns-site-theme", n); } catch (e) {}
  });
  var hh = document.getElementById("hh"), bg = document.getElementById("burger");
  if (bg) bg.addEventListener("click", function () { var o = hh.classList.toggle("open"); bg.setAttribute("aria-expanded", o); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && hh && hh.classList.contains("open")) { hh.classList.remove("open"); bg.setAttribute("aria-expanded", false); bg.focus(); } });
})();</script>

</body>
</html>
