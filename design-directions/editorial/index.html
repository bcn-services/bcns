<!doctype html>
<!-- PROTOTYPE — bcns home direction switcher — throwaway -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bcns directions</title>
<style>
html,body{margin:0;height:100%;background:#eee}
iframe{border:0;width:100%;height:100%;display:block}
#bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
 background:#2b2b2b;color:#fff;font:600 13px/1 system-ui;padding:8px 10px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:9}
#bar button{all:unset;cursor:pointer;padding:6px 10px;border-radius:999px;background:#444}
#bar button:hover{background:#ff5a1f}
#lbl{min-width:210px;text-align:center}
</style></head><body>
<iframe id="f" title="direction"></iframe>
<div id="bar"><button id="p" aria-label="Previous">&larr;</button><span id="lbl"></span><button id="n" aria-label="Next">&rarr;</button></div>
<script>
const V=[["A","Velobyte method"],["B","Linear-style"],["C","Stripe-style"],["D","bcns anchor"],["E","Cubes are the hero"],["F","Blocks stack up"],["G","Velobyte lanes"],["H","Center stage"]];
const f=document.getElementById('f'),lbl=document.getElementById('lbl');
let i=Math.max(0,V.findIndex(v=>v[0]===new URLSearchParams(location.search).get('v')));
function show(){f.src=V[i][0]+'.html';lbl.textContent=V[i][0]+' — '+V[i][1];history.replaceState(null,'','?v='+V[i][0]);}
function go(d){i=(i+d+V.length)%V.length;show();}
p.onclick=()=>go(-1);n.onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
show();
</script></body></html>
